# ysfdurak.com ortak altyapısında çalıştırma.
#   cd deploy && sudo docker compose -f docker-compose.ortak.yml up -d --build
# Nabız Analiz dışarıya açılmaz: Caddy bloğu yoktur. Nabız iç ağdan http://nabiz-analiz:8000 ile okur;
# Claude'a Nabız'ın MCP kapısı (güvenilirlik aracı) üzerinden ulaşılır. Veri tutmaz: birim yok.
name: nabiz-analiz
services:
  nabiz-analiz:
    build: ..
    container_name: nabiz-analiz
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
